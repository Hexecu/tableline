name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node: 22 }
          - { os: macos-15, node: 22 }
          - { os: ubuntu-24.04, node: 24 }
          - { os: ubuntu-24.04-arm, node: 24 }
          - { os: macos-15, node: 24 }
          - { os: macos-15-intel, node: 24 }
          - { os: windows-2025, node: 24 }
          - { os: windows-11-arm, node: 24 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run test:i18n
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate

  native-package:
    name: Packaged desktop / ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x64, bundle: linux-unpacked, executable: linux-unpacked/tableline }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64, bundle: linux-arm64-unpacked, executable: linux-arm64-unpacked/tableline }
          - { os: macos-15, platform: darwin, arch: arm64, bundle: mac-arm64/Tableline.app, executable: mac-arm64/Tableline.app/Contents/MacOS/Tableline }
          - { os: macos-15-intel, platform: darwin, arch: x64, bundle: mac/Tableline.app, executable: mac/Tableline.app/Contents/MacOS/Tableline }
          - { os: windows-2025, platform: win32, arch: x64, bundle: win-unpacked, executable: win-unpacked/Tableline.exe }
          - { os: windows-11-arm, platform: win32, arch: arm64, bundle: win-arm64-unpacked, executable: win-arm64-unpacked/Tableline.exe }
    env:
      TABLELINE_E2E_CREDENTIALS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Select disposable package paths on the native runner
        run: >-
          node -e "const fs=require('node:fs'),p=require('node:path'),out=p.join(process.env.RUNNER_TEMP,'tableline-native-package');
          const vars={TABLELINE_RELEASE_DIR:out,TABLELINE_PLATFORM_BUNDLE:p.join(out,'${{ matrix.bundle }}'),TABLELINE_E2E_EXECUTABLE:p.join(out,'${{ matrix.executable }}')};
          fs.appendFileSync(process.env.GITHUB_ENV,Object.entries(vars).map(([k,v])=>k+'='+v).join('\n')+'\n')"
      - name: Install isolated Linux desktop and keyring prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-1-0
      - run: npm ci
      - name: Assert the runner is native to the requested OS and CPU
        run: node -e "if(process.platform!=='${{ matrix.platform }}'||process.arch!=='${{ matrix.arch }}')throw Error('Runner target mismatch')"
      - name: Build and verify local package without signing credentials or publishing
        run: npm run package
      - name: Prepare the verified Linux sandbox helper in the disposable package
        if: runner.os == 'Linux'
        run: |
          test -f "$TABLELINE_PLATFORM_BUNDLE/chrome-sandbox"
          test ! -L "$TABLELINE_PLATFORM_BUNDLE/chrome-sandbox"
          sudo chown root:root "$TABLELINE_PLATFORM_BUNDLE/chrome-sandbox"
          sudo chmod 4755 "$TABLELINE_PLATFORM_BUNDLE/chrome-sandbox"
      - name: Run packaged platform acceptance on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:platform
      - name: Run packaged platform acceptance on macOS and Windows
        if: runner.os != 'Linux'
        env:
          DEBUG: ${{ runner.os == 'Windows' && 'pw:browser' || '' }}
        run: npm run test:platform
      - name: Run all five languages in the Linux package
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e:locales
      - name: Run all five languages in the macOS and Windows package
        if: runner.os != 'Linux'
        env:
          DEBUG: ${{ runner.os == 'Windows' && 'pw:browser' || '' }}
        run: npm run test:e2e:locales
      - name: Verify packaged AI configuration on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e:ai
      - name: Verify packaged AI configuration on macOS and Windows
        if: runner.os != 'Linux'
        env:
          DEBUG: ${{ runner.os == 'Windows' && 'pw:browser' || '' }}
        run: npm run test:e2e:ai
      - name: Verify real encrypted credential persistence in a disposable Linux keyring
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/e2e-storage.cjs
      - name: Refuse real Linux fixed-key fallback when all secret services are absent
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/e2e-storage-fallback.cjs
      - name: Verify real encrypted credential persistence with Windows DPAPI
        if: runner.os == 'Windows'
        env:
          DEBUG: pw:browser
        run: node scripts/e2e-storage.cjs
      - name: Upload reports only; compiled applications are never uploaded
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/platforms/*.json
            artifacts/e2e/locales/
            artifacts/e2e/storage/
            artifacts/e2e/storage-fallback/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove the temporary application package
        if: always()
        run: node -e "require('node:fs').rmSync(process.env.TABLELINE_RELEASE_DIR,{recursive:true,force:true})"

  secret-scan:
    name: Public source secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download checksum-pinned official Gitleaks CLI
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP"
      - name: Scan complete reachable public history without printing secrets
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --log-opts=--all --no-banner'
